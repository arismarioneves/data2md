<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    # Every worker holding a queued upload (see ConversionSemaphore::acquire)
    # is a worker that cannot serve /, /health or anything else. That is why
    # CONVERT_QUEUE_WAIT_SECONDS is kept short rather than raised: a longer
    # wait would just mean more of these 24 workers parked at once.
    MaxRequestWorkers        24
    MaxConnectionsPerChild   500
</IfModule>
