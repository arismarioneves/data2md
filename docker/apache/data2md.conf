ServerTokens Prod

# Derived by the entrypoint from APP_URL.
ServerName ${APACHE_SERVER_NAME}
ServerSignature Off
TraceEnable Off

# Derived by the entrypoint from CONVERT_TIMEOUT_SECONDS + CONVERT_QUEUE_WAIT_SECONDS.
Timeout ${APACHE_TIMEOUT}

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Derived by the entrypoint from MAX_FILE_SIZE_MB.
    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /

        # Hide the .php extension: /api → /api.php
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(.+)$ $1.php [L,QSA]
    </Directory>

    # Dotfiles are never served.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <IfModule mod_mime.c>
        AddType application/manifest+json .webmanifest
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always unset Server
        Header always unset X-Powered-By
    </IfModule>

    # A CustomLog takes one env= condition, so a positive flag is what lets a
    # request be excluded from `combined` without being logged twice.
    SetEnvIf Request_URI "."         d2md_log_combined
    # Health checks are noise.
    SetEnvIf Request_URI "^/health$" !d2md_log_combined
    # `combined` logs %r, which carries the magic-link token in the query
    # string. %U is the path alone.
    SetEnvIf Request_URI "^/login"   !d2md_log_combined
    SetEnvIf Request_URI "^/login"   d2md_noquery

    LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" noquery

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=d2md_log_combined
    CustomLog /proc/self/fd/1 noquery  env=d2md_noquery
</VirtualHost>
