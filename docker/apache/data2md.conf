ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Derived by the entrypoint from CONVERT_TIMEOUT_SECONDS + CONVERT_QUEUE_WAIT_SECONDS.
Timeout ${APACHE_TIMEOUT}

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Derived by the entrypoint from MAX_FILE_SIZE_MB.
    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /

        # Hide the .php extension: /api → /api.php
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(.+)$ $1.php [L,QSA]
    </Directory>

    # Dotfiles are never served.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <IfModule mod_mime.c>
        AddType application/manifest+json .webmanifest
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset Server
        Header always unset X-Powered-By
    </IfModule>

    # Health checks are noise in the access log.
    SetEnvIf Request_URI "^/health$" dontlog

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!dontlog
</VirtualHost>
