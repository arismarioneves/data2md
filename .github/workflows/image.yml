name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation never changes the image; skip the rebuild for doc-only pushes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: docker compose build test

      - name: Run the suite
        run: |
          docker compose run --rm test sh -c \
            "composer install --no-interaction && vendor/bin/phpunit"

  build-push:
    name: Build and publish
    needs: test
    # Pull requests get the suite and nothing else — no image is published from
    # an unmerged branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version stamp
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger the Easypanel deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            # Non-fatal: the image is already in GHCR by this point, so a flaky
            # hook call shouldn't mark the publish job as failed. It only means
            # EasyPanel needs a manual pull.
            curl -fsS -X POST "$HOOK" && echo "deploy hook triggered" \
              || echo "::warning::deploy hook failed — pull the new image manually"
          else
            echo "EASYPANEL_DEPLOY_HOOK not set — pull the new image manually"
          fi
