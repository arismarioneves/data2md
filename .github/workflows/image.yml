name: Build and push image

on:
  push:
    branches: [main]
    # Documentation never changes the image; skip the rebuild for doc-only pushes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: docker compose build test

      - name: Run the suite
        run: |
          docker compose run --rm test sh -c \
            "composer install --no-interaction && vendor/bin/phpunit"

  smoke:
    name: Smoke test the app image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SmokeTest.php exercises a running container end to end (health,
      # every page, the full convert → download round trip, security
      # headers). It exists precisely to catch what the unit suite cannot:
      # a broken entrypoint.sh, vhost, or php.ini in the image that actually
      # ships. Without this job, "the suite passes" and "the image works"
      # were never the same claim.
      - name: Build the app image
        run: docker compose build app

      - name: Start the app container
        run: docker compose up -d app

      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "app is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app never reported healthy on /health"
          docker compose logs app
          exit 1

      - name: Run SmokeTest against the running container
        run: |
          docker compose run --rm -e D2MD_BASE_URL=http://app test sh -c \
            "composer install --no-interaction && vendor/bin/phpunit --filter SmokeTest"

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-push:
    name: Build and publish
    needs: [test, smoke]
    # Pull requests get the suite and nothing else — no image is published from
    # an unmerged branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version stamp
        id: version
        run: echo "value=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger the Easypanel deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            # Non-fatal: the image is already in GHCR by this point, so a flaky
            # hook call shouldn't mark the publish job as failed. It only means
            # EasyPanel needs a manual pull.
            curl -fsS -X POST "$HOOK" && echo "deploy hook triggered" \
              || echo "::warning::deploy hook failed — pull the new image manually"
          else
            echo "EASYPANEL_DEPLOY_HOOK not set — pull the new image manually"
          fi
